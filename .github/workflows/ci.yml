name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.gif"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.png"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.gif"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.png"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Set up Node.js for project formatting
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Verify backend
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B verify 2>&1 | tee backend-verify.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend-verify.log
            services/yurlib-server/target/pmd.xml
            services/yurlib-server/target/site/jacoco/
            services/yurlib-server/target/spotbugsXml.xml
            services/yurlib-server/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/yurlib-web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/yurlib-web/package-lock.json
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee npm-ci.log
      - name: Run frontend tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --watch=false 2>&1 | tee frontend-test.log
      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee frontend-build.log

  compose:
    name: Compose Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose config 2>&1 | tee compose-config.log

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
