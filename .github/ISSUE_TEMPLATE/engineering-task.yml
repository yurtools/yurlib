name: Engineering task
description: Track implementation, architecture, infrastructure, or documentation work.
title: ""
labels:
  - engineering
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the problem and the observable result.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and references
      description: Link requirements, design sections, ADRs, and related issues.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide objective, verifiable completion criteria.
      placeholder: |
        - [ ] Criterion one
        - [ ] Criterion two
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and implications
      description: Note security, contract, database, observability, or operational effects.
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
