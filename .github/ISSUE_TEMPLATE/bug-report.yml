name: Bug report
description: Report reproducible incorrect Yurlib behavior.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include versions and configuration, but no secrets or private file content.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Redact paths, credentials, personal information, and private ebook content.
