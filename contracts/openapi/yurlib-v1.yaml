openapi: 3.1.0
info:
  title: Yurlib API
  version: 0.1.0
  description: Initial contract for the first local-library vertical slice.
servers:
  - url: /
paths:
  /api/v1/session:
    get:
      operationId: getSession
      summary: Read persisted-user authentication and capability state
      security: []
      responses:
        "200":
          description: Current owner session state and an Angular-compatible CSRF cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSession"
    post:
      operationId: createSession
      summary: Authenticate a persisted user
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        "204":
          description: Owner session created
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/session/logout:
    post:
      operationId: deleteSession
      summary: End the current user session
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Owner session ended
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/library-mounts:
    get:
      operationId: listLibraryMounts
      summary: List deployment-configured library mount aliases
      responses:
        "200":
          description: Allowed mount aliases without physical paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryMount"
  /api/v1/library-roots:
    get:
      operationId: listLibraryRoots
      summary: List configured library roots
      responses:
        "200":
          description: Configured roots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryRoot"
    post:
      operationId: createLibraryRoot
      summary: Configure and validate a typed library root
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRootRequest"
      responses:
        "201":
          description: Root configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryRoot"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/library-roots/{rootId}:
    delete:
      operationId: deleteLibraryRoot
      summary: Remove an unused library root
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RootId"
      responses:
        "204":
          description: Root removed
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/library-roots/{rootId}/scans:
    post:
      operationId: startLibraryScan
      summary: Queue a durable scan
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RootId"
      responses:
        "202":
          description: Scan queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/jobs/{jobId}:
    get:
      operationId: getScanJob
      summary: Read scan progress and failures
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scan job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/jobs/{jobId}/cancel:
    post:
      operationId: cancelScanJob
      summary: Request cooperative cancellation of a scan
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current scan state after the cancellation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/catalog/works:
    get:
      operationId: listWorks
      summary: Page and search provisional catalog works
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 200
        - name: format
          in: query
          description: Return works with at least one available asset in a selected format.
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              enum: [EPUB, FB2, MOBI, PDF, DOCX, DJVU]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Catalog page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPage"
  /api/v1/catalog/works/{workId}/cover:
    get:
      operationId: getWorkCover
      summary: Stream the selected authorized normalized cover
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: Immutable normalized cover bytes
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg: {}
            image/png: {}
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/works/{workId}:
    get:
      operationId: getWorkCuration
      summary: Read authorized metadata evidence, tags, reviews, and audit history
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: Work curation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCuration"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/works/{workId}/title:
    put:
      operationId: updateCuratedWorkTitle
      summary: Create a versioned curator title override
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataUpdateRequest"
      responses:
        "200":
          description: Updated work curation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCuration"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/works/{workId}/title/undo:
    post:
      operationId: undoCuratedWorkTitle
      summary: Undo the active curator title override
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedReasonRequest"
      responses:
        "200":
          description: Updated work curation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCuration"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/works/{workId}/tags:
    put:
      operationId: replaceWorkTags
      summary: Replace a work's curator-managed shared tags
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdateRequest"
      responses:
        "200":
          description: Updated work curation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCuration"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/works/{workId}/cover:
    put:
      operationId: selectCuratedWorkCover
      summary: Select a versioned preferred cover source asset
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverPreferenceRequest"
      responses:
        "200":
          description: Updated preferred cover source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverPreference"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/reviews:
    get:
      operationId: listMetadataReviews
      summary: List the bounded authorization-filtered metadata review queue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Open metadata review items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetadataReviewItem"
  /api/v1/curation/contributors/{contributorId}:
    put:
      operationId: updateCuratedContributor
      summary: Correct a contributor display name and curated aliases
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: contributorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributorUpdateRequest"
      responses:
        "200":
          description: Updated contributor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributorCuration"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/reviews/{reviewId}/dismiss:
    post:
      operationId: dismissMetadataReview
      summary: Dismiss an open metadata review item with a reason
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "204":
          description: Review dismissed
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/recovery/preview:
    get:
      operationId: previewCatalogRecovery
      summary: Preview a curator-reviewed catalog merge without changing state
      parameters:
        - $ref: "#/components/parameters/RecoverySubjectType"
        - $ref: "#/components/parameters/SurvivorId"
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Authorized merge impact and conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryPreview"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/recovery/merges:
    post:
      operationId: mergeCatalogSubjects
      summary: Apply an idempotent curator-reviewed catalog merge
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRequest"
      responses:
        "200":
          description: Applied or previously applied merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeOperation"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/recovery/merges/{operationId}/split-preview:
    get:
      operationId: previewCatalogSplit
      summary: Check whether a merge can be undone automatically
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Automatic-undo decision and guided-split conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitPreview"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/recovery/merges/{operationId}/undo:
    post:
      operationId: undoCatalogMerge
      summary: Undo an unchanged merge using its before image
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/OperationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Undone merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeOperation"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/recovery/not-same:
    post:
      operationId: markCatalogSubjectsNotSame
      summary: Suppress a duplicate candidate for the same rule and version
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotSameRequest"
      responses:
        "200":
          description: Durable duplicate decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateDecision"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/recovery/history:
    get:
      operationId: listCatalogRecoveryHistory
      summary: List authorized merge and undo history for a catalog subject
      parameters:
        - $ref: "#/components/parameters/RecoverySubjectType"
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Most recent recovery operations
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/MergeOperation"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/assets/{assetId}/content:
    get:
      operationId: downloadOriginalAsset
      summary: Stream an available authorized original or derived asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Original ebook bytes
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/epub+zip: {}
            application/xml: {}
            application/x-mobipocket-ebook: {}
            application/pdf: {}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: {}
            image/vnd.djvu: {}
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/assets/{assetId}/conversions:
    post:
      operationId: requestAssetConversion
      summary: Queue or return the idempotent supported conversion for an authorized source asset
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversionRequest"
      responses:
        "202":
          description: Durable conversion job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionJob"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/conversions/{jobId}:
    get:
      operationId: getConversionJob
      summary: Read an authorized conversion job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current conversion job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionJob"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/conversions/{jobId}/cancel:
    post:
      operationId: cancelConversionJob
      summary: Cooperatively cancel a queued or running conversion
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelConversionRequest"
      responses:
        "200":
          description: Current conversion job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionJob"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/me/library-state:
    get:
      operationId: getPersonalLibraryState
      summary: Read the current user's access-filtered personal library state
      responses:
        "200":
          description: Private favorites, read state, and collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalLibraryState"
  /api/v1/me/export:
    get:
      operationId: exportPersonalLibraryState
      summary: Export the current user's access-filtered personal library state
      responses:
        "200":
          description: Portable personal library state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalLibraryState"
  /api/v1/me/favorite-contributors/{contributorId}:
    parameters:
      - $ref: "#/components/parameters/ContributorId"
    put:
      operationId: addFavoriteContributor
      summary: Add an idempotent favorite for a visible canonical contributor
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Favorite contributor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteContributor"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeFavoriteContributor
      summary: Remove a favorite contributor
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Favorite removed or already absent
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/me/works/{workId}/read-state:
    parameters:
      - $ref: "#/components/parameters/WorkId"
    put:
      operationId: markWorkRead
      summary: Create or replace the current user's Work-level read state
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          description: Updated read state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkReadState"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: markWorkUnread
      summary: Remove the current user's Work-level read state
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "204":
          description: Read state removed
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/me/collections:
    post:
      operationId: createPersonalCollection
      summary: Create a private collection
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalCollectionRequest"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCollection"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/me/collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    put:
      operationId: updatePersonalCollection
      summary: Rename a private collection or change its ordering mode
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonalCollectionRequest"
      responses:
        "200":
          description: Collection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCollection"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePersonalCollection
      summary: Delete a private collection
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "204":
          description: Collection deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/me/collections/{collectionId}/works/{workId}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
      - $ref: "#/components/parameters/WorkId"
    put:
      operationId: addWorkToPersonalCollection
      summary: Add a visible Work to a private collection
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionVersionRequest"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCollection"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeWorkFromPersonalCollection
      summary: Remove a Work from a private collection
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCollection"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List persisted users and their authorization state
      responses:
        "200":
          description: Persisted users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"
    post:
      operationId: createUser
      summary: Create a persisted user
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users/{userId}:
    delete:
      operationId: removeUser
      summary: Remove a non-owner account and its private personal state
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: User removed and identity anonymized for retained audit records
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users/{userId}/enabled:
    put:
      operationId: setUserEnabled
      summary: Enable or disable a persisted user
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
  /api/v1/admin/users/{userId}/credential:
    put:
      operationId: resetUserCredential
      summary: Reset a persisted user's password
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
  /api/v1/admin/users/{userId}/capabilities:
    put:
      operationId: replaceUserCapabilities
      summary: Replace a user's independently grantable capabilities
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capabilities]
              properties:
                capabilities:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/Capability"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
  /api/v1/admin/users/{userId}/root-denies/{rootId}:
    put:
      operationId: denyUserRoot
      summary: Deny a root to a user
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RootId"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
    delete:
      operationId: allowUserRoot
      summary: Remove a user's explicit root deny
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RootId"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    RootId:
      name: rootId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContributorId:
      name: contributorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    RecoverySubjectType:
      name: subjectType
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/RecoverableSubjectType"
    SurvivorId:
      name: survivorId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OwnerSession:
      type: object
      additionalProperties: false
      required: [mode, authenticated, owner, capabilities]
      properties:
        mode:
          type: string
          enum: [OWNER, LOOPBACK_DEVELOPMENT]
        authenticated:
          type: boolean
        username:
          type: [string, "null"]
        owner:
          type: boolean
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Capability"
    LibraryMount:
      type: object
      additionalProperties: false
      required: [alias]
      properties:
        alias:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}$"
    CreateLibraryRootRequest:
      type: object
      additionalProperties: false
      required: [name, mountAlias, relativePath, identityToken, mode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        mountAlias:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}$"
        relativePath:
          type: string
          maxLength: 1024
          description: Normalized path relative to the deployment-owned mount alias.
        identityToken:
          type: string
          minLength: 16
          maxLength: 200
          writeOnly: true
        mode:
          type: string
          enum: [READ_ONLY_SOURCE, MANAGED_OUTPUT]
        defaultForCovers:
          type: boolean
          default: false
        defaultForConversions:
          type: boolean
          default: false
    LibraryRoot:
      type: object
      required: [id, name, mountAlias, relativePath, mode, availability, defaultForCovers]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mountAlias:
          type: string
        relativePath:
          type: string
        mode:
          type: string
          enum: [READ_ONLY_SOURCE, MANAGED_OUTPUT]
        availability:
          $ref: "#/components/schemas/RootAvailability"
        lastSuccessfulScanAt:
          type: [string, "null"]
          format: date-time
        defaultForCovers:
          type: boolean
        defaultForConversions:
          type: boolean
    ConversionRequest:
      type: object
      additionalProperties: false
      required: [route]
      properties:
        route:
          $ref: "#/components/schemas/ConversionRoute"
    CancelConversionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    ConversionRoute:
      type: string
      enum: [FB2_TO_EPUB_V1, MOBI_TO_EPUB_V1]
    ConversionJob:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceAssetId
        - route
        - state
        - attemptCount
        - cancellationRequested
        - createdAt
        - version
      properties:
        id:
          type: string
          format: uuid
        sourceAssetId:
          type: string
          format: uuid
        derivedAssetId:
          type: [string, "null"]
          format: uuid
        route:
          $ref: "#/components/schemas/ConversionRoute"
        state:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED_SAFE, CANCELLED]
        attemptCount:
          type: integer
          minimum: 0
          maximum: 3
        cancellationRequested:
          type: boolean
        errorCode:
          type: [string, "null"]
        safeDiagnostic:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    RootAvailability:
      type: string
      enum: [UNKNOWN, AVAILABLE, UNAVAILABLE, IDENTITY_MISMATCH]
    ScanJob:
      type: object
      required:
        - id
        - rootId
        - state
        - discoveredCount
        - processedCount
        - skippedCount
        - failedCount
        - failures
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        rootId:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, COMPLETED_WITH_FAILURES, FAILED, CANCELLED]
        discoveredCount:
          type: integer
          format: int64
          minimum: 0
        processedCount:
          type: integer
          format: int64
          minimum: 0
        skippedCount:
          type: integer
          format: int64
          minimum: 0
        failedCount:
          type: integer
          format: int64
          minimum: 0
        coverageComplete:
          type: boolean
          default: false
        failures:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FileFailure"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    FileFailure:
      type: object
      required: [relativePath, code, detail]
      properties:
        relativePath:
          type: string
        code:
          type: string
        detail:
          type: string
    WorkPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkSummary"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
    WorkSummary:
      type: object
      required: [id, title, provisional, assets, coverAvailable]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        contributors:
          type: array
          items:
            type: string
        contributorDetails:
          type: array
          items:
            $ref: "#/components/schemas/CatalogContributor"
        provisional:
          type: boolean
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetSummary"
        coverAvailable:
          type: boolean
    CatalogContributor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    AssetSummary:
      type: object
      required: [id, format, size, availability, original, metadataState]
      properties:
        id:
          type: string
          format: uuid
        format:
          type: string
          enum: [EPUB, FB2, MOBI, PDF, DOCX, DJVU]
        size:
          type: integer
          format: int64
          minimum: 0
        availability:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        original:
          type: boolean
        metadataState:
          type: string
          enum: [PENDING, READY, FAILED_SAFE]
    CoverPreferenceRequest:
      type: object
      additionalProperties: false
      required: [sourceAssetId, reason, expectedVersion]
      properties:
        sourceAssetId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    CoverPreference:
      type: object
      additionalProperties: false
      required: [workId, sourceAssetId, version]
      properties:
        workId:
          type: string
          format: uuid
        sourceAssetId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
    RecoverableSubjectType:
      type: string
      enum: [WORK, EDITION, CONTRIBUTOR]
    RecoverySubjectSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, version]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
    RecoveryImpact:
      type: object
      additionalProperties: false
      required:
        - editions
        - assets
        - observations
        - contributors
        - tags
        - personalReadStates
        - collectionMemberships
        - favoriteUsers
      properties:
        editions: { type: integer, format: int64, minimum: 0 }
        assets: { type: integer, format: int64, minimum: 0 }
        observations: { type: integer, format: int64, minimum: 0 }
        contributors: { type: integer, format: int64, minimum: 0 }
        tags: { type: integer, format: int64, minimum: 0 }
        personalReadStates: { type: integer, format: int64, minimum: 0 }
        collectionMemberships: { type: integer, format: int64, minimum: 0 }
        favoriteUsers: { type: integer, format: int64, minimum: 0 }
    RecoveryPreview:
      type: object
      additionalProperties: false
      required: [subjectType, survivor, source, impact, mergeAllowed, conflicts]
      properties:
        subjectType:
          $ref: "#/components/schemas/RecoverableSubjectType"
        survivor:
          $ref: "#/components/schemas/RecoverySubjectSummary"
        source:
          $ref: "#/components/schemas/RecoverySubjectSummary"
        impact:
          $ref: "#/components/schemas/RecoveryImpact"
        mergeAllowed:
          type: boolean
        conflicts:
          type: array
          items:
            type: string
    MergeRequest:
      type: object
      additionalProperties: false
      required: [subjectType, survivorId, sourceId, survivorVersion, sourceVersion, idempotencyKey, reason]
      properties:
        subjectType:
          $ref: "#/components/schemas/RecoverableSubjectType"
        survivorId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        survivorVersion:
          type: integer
          format: int64
          minimum: 0
        sourceVersion:
          type: integer
          format: int64
          minimum: 0
        idempotencyKey:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    MergeOperation:
      type: object
      additionalProperties: false
      required: [id, subjectType, survivorId, sourceId, status, actorId, reason, createdAt, undoneAt]
      properties:
        id:
          type: string
          format: uuid
        subjectType:
          $ref: "#/components/schemas/RecoverableSubjectType"
        survivorId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPLIED, UNDONE]
        actorId:
          type: string
          format: uuid
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        undoneAt:
          type: [string, "null"]
          format: date-time
    SplitPreview:
      type: object
      additionalProperties: false
      required: [operation, automaticUndoAllowed, conflicts]
      properties:
        operation:
          $ref: "#/components/schemas/MergeOperation"
        automaticUndoAllowed:
          type: boolean
        conflicts:
          type: array
          items:
            type: string
    NotSameRequest:
      type: object
      additionalProperties: false
      required: [subjectType, firstId, secondId, ruleName, ruleVersion, reason]
      properties:
        subjectType:
          $ref: "#/components/schemas/RecoverableSubjectType"
        firstId:
          type: string
          format: uuid
        secondId:
          type: string
          format: uuid
        ruleName:
          type: string
          minLength: 1
          maxLength: 100
        ruleVersion:
          type: string
          minLength: 1
          maxLength: 100
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    DuplicateDecision:
      type: object
      additionalProperties: false
      required: [id, subjectType, firstSubjectId, secondSubjectId, ruleName, ruleVersion, reason, createdAt]
      properties:
        id:
          type: string
          format: uuid
        subjectType:
          $ref: "#/components/schemas/RecoverableSubjectType"
        firstSubjectId:
          type: string
          format: uuid
        secondSubjectId:
          type: string
          format: uuid
        ruleName:
          type: string
        ruleVersion:
          type: string
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkCuration:
      type: object
      additionalProperties: false
      required: [id, version, title, contributors, tags, reviews, audit]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        title:
          $ref: "#/components/schemas/MetadataField"
        contributors:
          type: array
          items:
            $ref: "#/components/schemas/ContributorCuration"
        tags:
          type: array
          maxItems: 50
          items:
            type: string
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/MetadataReviewItem"
        audit:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CatalogAuditEvent"
    MetadataField:
      type: object
      additionalProperties: false
      required: [value, source, overrideVersion, observedValues, history]
      properties:
        value:
          type: [string, "null"]
        source:
          type: string
          enum: [CURATED, RESOLVED, OBSERVED, PROVISIONAL]
        overrideVersion:
          type: integer
          format: int64
          minimum: 0
        observedValues:
          type: array
          items:
            type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/OverrideHistory"
    ContributorCuration:
      type: object
      additionalProperties: false
      required: [id, displayName, role, version, aliases]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [AUTHOR, EDITOR, TRANSLATOR, ILLUSTRATOR, OTHER]
        version:
          type: integer
          format: int64
          minimum: 0
        aliases:
          type: array
          maxItems: 100
          items:
            type: string
    OverrideHistory:
      type: object
      additionalProperties: false
      required: [id, value, valueState, actorId, reason, version, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        value:
          type: [string, "null"]
        valueState:
          type: string
          enum: [PRESENT, ABSENT]
        actorId:
          type: string
          format: uuid
        reason:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    MetadataReviewItem:
      type: object
      additionalProperties: false
      required: [id, subjectId, subjectType, fieldName, reasonCode, detail, ruleName, ruleVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        subjectType:
          type: string
          enum: [WORK, EDITION, ASSET, CONTRIBUTOR]
        fieldName:
          type: string
        reasonCode:
          type: string
          enum: [INVALID_VALUE, AMBIGUOUS_VALUE, CONFLICT]
        detail:
          type: string
        ruleName:
          type: string
        ruleVersion:
          type: string
        createdAt:
          type: string
          format: date-time
    CatalogAuditEvent:
      type: object
      additionalProperties: false
      required: [id, eventType, actorId, reason, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        actorId:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    MetadataUpdateRequest:
      type: object
      additionalProperties: false
      required: [value, reason, expectedVersion]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 2000
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    VersionedReasonRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    TagUpdateRequest:
      type: object
      additionalProperties: false
      required: [tags, reason, expectedVersion]
      properties:
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ContributorUpdateRequest:
      type: object
      additionalProperties: false
      required: [displayName, aliases, reason, expectedVersion]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 1000
        aliases:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 1000
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    PersonalLibraryState:
      type: object
      additionalProperties: false
      required: [favoriteContributors, readStates, collections]
      properties:
        favoriteContributors:
          type: array
          items:
            $ref: "#/components/schemas/FavoriteContributor"
        readStates:
          type: array
          items:
            $ref: "#/components/schemas/WorkReadState"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/PersonalCollection"
    FavoriteContributor:
      type: object
      additionalProperties: false
      required: [contributorId, displayName, favoritedAt]
      properties:
        contributorId:
          type: string
          format: uuid
        displayName:
          type: string
        favoritedAt:
          type: string
          format: date-time
    WorkReadState:
      type: object
      additionalProperties: false
      required: [workId, completedEditionId, completedAt, version]
      properties:
        workId:
          type: string
          format: uuid
        completedEditionId:
          type: [string, "null"]
          format: uuid
        completedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    PersonalCollection:
      type: object
      additionalProperties: false
      required: [id, name, ordered, version, works]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ordered:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
        works:
          type: array
          items:
            $ref: "#/components/schemas/PersonalCollectionWork"
    PersonalCollectionWork:
      type: object
      additionalProperties: false
      required: [workId, title, position, addedAt]
      properties:
        workId:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        position:
          type: [integer, "null"]
          minimum: 0
        addedAt:
          type: string
          format: date-time
    MarkReadRequest:
      type: object
      additionalProperties: false
      required: [completedEditionId, completedAt, expectedVersion]
      properties:
        completedEditionId:
          type: [string, "null"]
          format: uuid
        completedAt:
          type: string
          format: date-time
        expectedVersion:
          type: integer
          format: int64
          minimum: -1
    CreatePersonalCollectionRequest:
      type: object
      additionalProperties: false
      required: [name, ordered]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        ordered:
          type: boolean
    UpdatePersonalCollectionRequest:
      type: object
      additionalProperties: false
      required: [name, ordered, expectedVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        ordered:
          type: boolean
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    CollectionVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    Capability:
      type: string
      enum: [MANAGE_INGESTION_SOURCES, CURATE_CATALOG]
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 200
          writeOnly: true
    CredentialRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 200
          writeOnly: true
    UserAccount:
      type: object
      additionalProperties: false
      required: [id, username, owner, enabled, authorizationVersion, capabilities, deniedRootIds]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        owner:
          type: boolean
        enabled:
