openapi: 3.1.0
info:
  title: Yurlib API
  version: 0.1.0
  description: Initial contract for the first local-library vertical slice.
servers:
  - url: /
paths:
  /api/v1/session:
    get:
      operationId: getSession
      summary: Read persisted-user authentication and capability state
      security: []
      responses:
        "200":
          description: Current owner session state and an Angular-compatible CSRF cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSession"
    post:
      operationId: createSession
      summary: Authenticate a persisted user
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        "204":
          description: Owner session created
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/session/logout:
    post:
      operationId: deleteSession
      summary: End the current user session
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Owner session ended
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/library-mounts:
    get:
      operationId: listLibraryMounts
      summary: List deployment-configured library mount aliases
      responses:
        "200":
          description: Allowed mount aliases without physical paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryMount"
  /api/v1/library-roots:
    get:
      operationId: listLibraryRoots
      summary: List configured library roots
      responses:
        "200":
          description: Configured roots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryRoot"
    post:
      operationId: createLibraryRoot
      summary: Configure and validate a typed library root
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRootRequest"
      responses:
        "201":
          description: Root configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryRoot"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/library-roots/{rootId}:
    delete:
      operationId: deleteLibraryRoot
      summary: Remove an unused library root
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RootId"
      responses:
        "204":
          description: Root removed
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/library-roots/{rootId}/scans:
    post:
      operationId: startLibraryScan
      summary: Queue a durable scan
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RootId"
      responses:
        "202":
          description: Scan queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/jobs/{jobId}:
    get:
      operationId: getScanJob
      summary: Read scan progress and failures
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scan job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/jobs/{jobId}/cancel:
    post:
      operationId: cancelScanJob
      summary: Request cooperative cancellation of a scan
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current scan state after the cancellation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/catalog/works:
    get:
      operationId: listWorks
      summary: Page and search provisional catalog works
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 200
        - name: format
          in: query
          description: Return works with at least one available asset in a selected format.
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              enum: [EPUB, FB2, MOBI, PDF, DOCX, DJVU]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Catalog page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPage"
  /api/v1/curation/works/{workId}:
    get:
      operationId: getWorkCuration
      summary: Read authorized metadata evidence, tags, reviews, and audit history
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: Work curation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCuration"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/works/{workId}/title:
    put:
      operationId: updateCuratedWorkTitle
      summary: Create a versioned curator title override
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataUpdateRequest"
      responses:
        "200":
          description: Updated work curation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCuration"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/works/{workId}/title/undo:
    post:
      operationId: undoCuratedWorkTitle
      summary: Undo the active curator title override
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedReasonRequest"
      responses:
        "200":
          description: Updated work curation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCuration"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/works/{workId}/tags:
    put:
      operationId: replaceWorkTags
      summary: Replace a work's curator-managed shared tags
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdateRequest"
      responses:
        "200":
          description: Updated work curation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCuration"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/reviews:
    get:
      operationId: listMetadataReviews
      summary: List the bounded authorization-filtered metadata review queue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Open metadata review items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetadataReviewItem"
  /api/v1/curation/contributors/{contributorId}:
    put:
      operationId: updateCuratedContributor
      summary: Correct a contributor display name and curated aliases
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: contributorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributorUpdateRequest"
      responses:
        "200":
          description: Updated contributor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributorCuration"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/curation/reviews/{reviewId}/dismiss:
    post:
      operationId: dismissMetadataReview
      summary: Dismiss an open metadata review item with a reason
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "204":
          description: Review dismissed
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/assets/{assetId}/content:
    get:
      operationId: downloadOriginalAsset
      summary: Stream an available original asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Original ebook bytes
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/epub+zip: {}
            application/xml: {}
            application/x-mobipocket-ebook: {}
            application/pdf: {}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: {}
            image/vnd.djvu: {}
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List persisted users and their authorization state
      responses:
        "200":
          description: Persisted users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"
    post:
      operationId: createUser
      summary: Create a persisted user
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users/{userId}/enabled:
    put:
      operationId: setUserEnabled
      summary: Enable or disable a persisted user
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
  /api/v1/admin/users/{userId}/credential:
    put:
      operationId: resetUserCredential
      summary: Reset a persisted user's password
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
  /api/v1/admin/users/{userId}/capabilities:
    put:
      operationId: replaceUserCapabilities
      summary: Replace a user's independently grantable capabilities
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capabilities]
              properties:
                capabilities:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/Capability"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
  /api/v1/admin/users/{userId}/root-denies/{rootId}:
    put:
      operationId: denyUserRoot
      summary: Deny a root to a user
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RootId"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
    delete:
      operationId: allowUserRoot
      summary: Remove a user's explicit root deny
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RootId"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    RootId:
      name: rootId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OwnerSession:
      type: object
      additionalProperties: false
      required: [mode, authenticated, owner, capabilities]
      properties:
        mode:
          type: string
          enum: [OWNER, LOOPBACK_DEVELOPMENT]
        authenticated:
          type: boolean
        username:
          type: [string, "null"]
        owner:
          type: boolean
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Capability"
    LibraryMount:
      type: object
      additionalProperties: false
      required: [alias]
      properties:
        alias:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}$"
    CreateLibraryRootRequest:
      type: object
      additionalProperties: false
      required: [name, mountAlias, relativePath, identityToken, mode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        mountAlias:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}$"
        relativePath:
          type: string
          maxLength: 1024
          description: Normalized path relative to the deployment-owned mount alias.
        identityToken:
          type: string
          minLength: 16
          maxLength: 200
          writeOnly: true
        mode:
          type: string
          enum: [READ_ONLY_SOURCE, MANAGED_OUTPUT]
    LibraryRoot:
      type: object
      required: [id, name, mountAlias, relativePath, mode, availability]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mountAlias:
          type: string
        relativePath:
          type: string
        mode:
          type: string
          enum: [READ_ONLY_SOURCE, MANAGED_OUTPUT]
        availability:
          $ref: "#/components/schemas/RootAvailability"
        lastSuccessfulScanAt:
          type: [string, "null"]
          format: date-time
    RootAvailability:
      type: string
      enum: [UNKNOWN, AVAILABLE, UNAVAILABLE, IDENTITY_MISMATCH]
    ScanJob:
      type: object
      required:
        - id
        - rootId
        - state
        - discoveredCount
        - processedCount
        - skippedCount
        - failedCount
        - failures
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        rootId:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, COMPLETED_WITH_FAILURES, FAILED, CANCELLED]
        discoveredCount:
          type: integer
          format: int64
          minimum: 0
        processedCount:
          type: integer
          format: int64
          minimum: 0
        skippedCount:
          type: integer
          format: int64
          minimum: 0
        failedCount:
          type: integer
          format: int64
          minimum: 0
        coverageComplete:
          type: boolean
          default: false
        failures:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FileFailure"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    FileFailure:
      type: object
      required: [relativePath, code, detail]
      properties:
        relativePath:
          type: string
        code:
          type: string
        detail:
          type: string
    WorkPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkSummary"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
    WorkSummary:
      type: object
      required: [id, title, provisional, assets]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        contributors:
          type: array
          items:
            type: string
        provisional:
          type: boolean
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetSummary"
    AssetSummary:
      type: object
      required: [id, format, size, availability, original, metadataState]
      properties:
        id:
          type: string
          format: uuid
        format:
          type: string
          enum: [EPUB, FB2, MOBI, PDF, DOCX, DJVU]
        size:
          type: integer
          format: int64
          minimum: 0
        availability:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        original:
          type: boolean
        metadataState:
          type: string
          enum: [PENDING, READY, FAILED_SAFE]
    WorkCuration:
      type: object
      additionalProperties: false
      required: [id, version, title, contributors, tags, reviews, audit]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        title:
          $ref: "#/components/schemas/MetadataField"
        contributors:
          type: array
          items:
            $ref: "#/components/schemas/ContributorCuration"
        tags:
          type: array
          maxItems: 50
          items:
            type: string
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/MetadataReviewItem"
        audit:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CatalogAuditEvent"
    MetadataField:
      type: object
      additionalProperties: false
      required: [value, source, overrideVersion, observedValues, history]
      properties:
        value:
          type: [string, "null"]
        source:
          type: string
          enum: [CURATED, RESOLVED, OBSERVED, PROVISIONAL]
        overrideVersion:
          type: integer
          format: int64
          minimum: 0
        observedValues:
          type: array
          items:
            type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/OverrideHistory"
    ContributorCuration:
      type: object
      additionalProperties: false
      required: [id, displayName, role, version, aliases]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [AUTHOR, EDITOR, TRANSLATOR, ILLUSTRATOR, OTHER]
        version:
          type: integer
          format: int64
          minimum: 0
        aliases:
          type: array
          maxItems: 100
          items:
            type: string
    OverrideHistory:
      type: object
      additionalProperties: false
      required: [id, value, valueState, actorId, reason, version, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        value:
          type: [string, "null"]
        valueState:
          type: string
          enum: [PRESENT, ABSENT]
        actorId:
          type: string
          format: uuid
        reason:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    MetadataReviewItem:
      type: object
      additionalProperties: false
      required: [id, subjectId, subjectType, fieldName, reasonCode, detail, ruleName, ruleVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        subjectType:
          type: string
          enum: [WORK, EDITION, ASSET, CONTRIBUTOR]
        fieldName:
          type: string
        reasonCode:
          type: string
          enum: [INVALID_VALUE, AMBIGUOUS_VALUE, CONFLICT]
        detail:
          type: string
        ruleName:
          type: string
        ruleVersion:
          type: string
        createdAt:
          type: string
          format: date-time
    CatalogAuditEvent:
      type: object
      additionalProperties: false
      required: [id, eventType, actorId, reason, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        actorId:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    MetadataUpdateRequest:
      type: object
      additionalProperties: false
      required: [value, reason, expectedVersion]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 2000
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    VersionedReasonRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    TagUpdateRequest:
      type: object
      additionalProperties: false
      required: [tags, reason, expectedVersion]
      properties:
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ContributorUpdateRequest:
      type: object
      additionalProperties: false
      required: [displayName, aliases, reason, expectedVersion]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 1000
        aliases:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 1000
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    Capability:
      type: string
      enum: [MANAGE_INGESTION_SOURCES, CURATE_CATALOG]
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 200
          writeOnly: true
    CredentialRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 200
          writeOnly: true
    UserAccount:
      type: object
      additionalProperties: false
      required: [id, username, owner, enabled, authorizationVersion, capabilities, deniedRootIds]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        owner:
          type: boolean
        enabled:
          type: boolean
        authorizationVersion:
          type: integer
          format: int64
          minimum: 1
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Capability"
        deniedRootIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        correlationId:
          type: string
security:
  - sessionCookie: []
