spring:
  application:
    name: yurlib-server
  datasource:
    url: ${YURLIB_DB_URL:jdbc:postgresql://localhost:5432/yurlib}
    username: ${YURLIB_DB_USERNAME:yurlib}
    password: ${YURLIB_DB_PASSWORD:yurlib-dev-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${YURLIB_SESSION_COOKIE_SECURE:true}

yurlib:
  security:
    owner:
      username: ${YURLIB_OWNER_USERNAME:owner}
      password: ${YURLIB_OWNER_PASSWORD:}
      recovery-mode: false
      recovery-password: ${YURLIB_OWNER_RECOVERY_PASSWORD:}
  library:
    mounts: []
    scan:
      lease-timeout: 1m
      poll-delay: 1s
      worker-enabled: true
