name: yurlib

services:
  server:
    build:
      context: .
      dockerfile: services/yurlib-server/Dockerfile
    environment:
      YURLIB_DB_URL: jdbc:postgresql://postgres:5432/${YURLIB_DB_NAME:-yurlib}
      YURLIB_DB_USERNAME: ${YURLIB_DB_USERNAME:-yurlib}
      YURLIB_DB_PASSWORD: ${YURLIB_DB_PASSWORD:-yurlib-dev-only}
      YURLIB_OWNER_USERNAME: ${YURLIB_OWNER_USERNAME:-owner}
      YURLIB_OWNER_PASSWORD: ${YURLIB_OWNER_PASSWORD:-}
      YURLIB_SESSION_COOKIE_SECURE: ${YURLIB_SESSION_COOKIE_SECURE:-false}
      YURLIB_WORKER_TOKEN: ${YURLIB_WORKER_TOKEN:-}
      YURLIB_PDF_STAGING_DIRECTORY: /var/lib/yurlib/staging/pdf
      YURLIB_COVER_STAGING_DIRECTORY: /var/lib/yurlib/staging/covers
      YURLIB_LIBRARY_MOUNTS_0_ALIAS: main
      YURLIB_LIBRARY_MOUNTS_0_PATH: /library/main
      YURLIB_LIBRARY_MOUNTS_1_ALIAS: managed
      YURLIB_LIBRARY_MOUNTS_1_PATH: /library/managed
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${YURLIB_SERVER_HOST:-127.0.0.1}:${YURLIB_SERVER_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${YURLIB_LIBRARY_MAIN_PATH:-./.local/library}
        target: /library/main
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${YURLIB_LIBRARY_MANAGED_PATH:-./.local/managed}
        target: /library/managed
        bind:
          create_host_path: false
      - yurlib-document-staging:/var/lib/yurlib/staging
    networks:
      - backend
      - worker-internal

  document-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: services/yurlib-document-worker/Dockerfile
    environment:
      YURLIB_WORKER_SERVER_URL: http://server:8080
      YURLIB_WORKER_TOKEN: ${YURLIB_WORKER_TOKEN:-}
      YURLIB_WORKER_DIRECTORY: /work
    depends_on:
      server:
        condition: service_started
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 2g
    cpus: 1.0
    tmpfs:
      - /work:size=2g,mode=0700,uid=10001,gid=10001
    networks:
      - worker-internal

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${YURLIB_DB_NAME:-yurlib}
      POSTGRES_USER: ${YURLIB_DB_USERNAME:-yurlib}
      POSTGRES_PASSWORD: ${YURLIB_DB_PASSWORD:-yurlib-dev-only}
    ports:
      - "${YURLIB_DB_HOST:-127.0.0.1}:${YURLIB_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - yurlib-postgres-data:/var/lib/postgresql
    networks:
      - backend

volumes:
  yurlib-postgres-data:
  yurlib-document-staging:

networks:
  backend:
  worker-internal:
    internal: true
