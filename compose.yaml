name: yurlib

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${YURLIB_DB_NAME:-yurlib}
      POSTGRES_USER: ${YURLIB_DB_USERNAME:-yurlib}
      POSTGRES_PASSWORD: ${YURLIB_DB_PASSWORD:-yurlib-dev-only}
    ports:
      - "${YURLIB_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - yurlib-postgres-data:/var/lib/postgresql/data

volumes:
  yurlib-postgres-data:
